name: check-in-job

on:
  workflow_dispatch:  # 手动触发（强制执行，不经过 guard）
  schedule:
      # 表达式生成: https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
      # GitHub 在高峰时段的 schedule 会延迟甚至跳过，因此设置多个时间点；
      # 每个 run 开头由 guard step 检查「10 小时内是否已有成功运行」，保证每天只真正执行一次
    - cron: '17 16 * * *'  # 北京 00:17（主）
    - cron: '17 18 * * *'  # 北京 02:17（兜底 1）
    - cron: '17 20 * * *'  # 北京 04:17（兜底 2）
    - cron: '47 22 * * *'  # 北京 06:47（兜底 3）

permissions:
  contents: write
  actions: read

concurrency:
  group: 69yun-checkin-job-daily
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
    - name: Guard - 当天已成功执行过则跳过
      id: guard
      if: github.event_name == 'schedule'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -e
        WF_FILE="${GITHUB_WORKFLOW_REF%%@*}"
        WF_FILE="${WF_FILE##*/}"
        echo "workflow file: $WF_FILE"
        LAST=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$WF_FILE" \
               --status success --limit 1 --json createdAt --jq '.[0].createdAt // empty' 2>/dev/null || true)
        echo "last success run: ${LAST:-<none>}"
        if [ -n "$LAST" ]; then
          LAST_EPOCH=$(date -u -d "$LAST" +%s 2>/dev/null || echo 0)
          NOW_EPOCH=$(date -u +%s)
          DIFF=$(( NOW_EPOCH - LAST_EPOCH ))
          echo "seconds since last success: $DIFF"
          if [ "$DIFF" -lt 36000 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "10 小时内已有成功运行，跳过本次"
            exit 0
          fi
        fi
        RUNNING=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$WF_FILE" \
                  --status in_progress --limit 5 --json databaseId --jq 'length' 2>/dev/null || true)
        echo "in_progress runs (incl. self): ${RUNNING:-0}"
        if [ "${RUNNING:-0}" -ge 2 ]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "已有另一个运行在执行中，跳过本次"
          exit 0
        fi
        echo "skip=false" >> "$GITHUB_OUTPUT"

    - name: Checkout repository
      if: steps.guard.outputs.skip != 'true'
      uses: actions/checkout@v4

    - name: Set up Node.js
      if: steps.guard.outputs.skip != 'true'
      uses: actions/setup-node@v4
      with:
        node-version: '22'  # LTS

    - name: Install dependencies
      if: steps.guard.outputs.skip != 'true'
      run: |
        npm install
        npm install node-fetch

    - name: Run scheduled check-in
      if: steps.guard.outputs.skip != 'true'
      run: |
        node _worker.js
      env:
        DOMAIN: ${{ secrets.DOMAIN }}  # 从 GitHub Secrets 中读取配置信息
        USERNAME: ${{ secrets.USERNAME }}
        PASSWORD: ${{ secrets.PASSWORD }}
        DOMAIN2: ${{ secrets.DOMAIN2 }}  # 第二站（wjkc 网际快车），账号缺省复用 USERNAME/PASSWORD
        USERNAME2: ${{ secrets.USERNAME2 }}
        PASSWORD2: ${{ secrets.PASSWORD2 }}
        TG_TOKEN: ${{ secrets.TG_TOKEN }}
        TG_ID: ${{ secrets.TG_ID }}

    # 👇 保活任务（关键）
    # 始终执行：即使上面的签到被 guard 跳过，仓库也保持每日活动
    - name: Checkout repository (keepalive)
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 获取完整的 git 历史
        persist-credentials: true  # 保持凭证

    - name: Keep repo alive
      run: |
        git config --local user.name "actions@github.com"
        git config --local user.email "GitHub Actions"
        git add .
        git commit --allow-empty -m "$(date '+%Y-%m-%d %H:%M:%S')更新"

    - name: 推送远端
      run: |
        git push
