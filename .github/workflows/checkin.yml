name: Yue.to Daily Check-in & Games

on:
  schedule:
    # Actions cron 使用 UTC；北京时间 = UTC + 8
    # GitHub 在高峰时段的 schedule 会延迟甚至跳过，因此设置多个时间点；
    # 每个 run 开头由 guard step 检查「10 小时内是否已有成功运行」，保证每天只真正执行一次
    - cron: '17 16 * * *'  # 北京 00:17（主）
    - cron: '17 18 * * *'  # 北京 02:17（兜底 1）
    - cron: '17 20 * * *'  # 北京 04:17（兜底 2）
    - cron: '47 22 * * *'  # 北京 06:47（兜底 3）
  workflow_dispatch: # 手动触发（强制执行，不经过 guard）

permissions:
  contents: read
  actions: read

concurrency:
  group: yue-to-checkin-daily
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yue-to-checkin
    steps:
      - name: Guard - 当天已成功执行过则跳过
        id: guard
        if: github.event_name == 'schedule'
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          WF_FILE="${GITHUB_WORKFLOW_REF%%@*}"
          WF_FILE="${WF_FILE##*/}"
          echo "workflow file: $WF_FILE"
          LAST=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$WF_FILE" \
                 --status success --limit 1 --json createdAt --jq '.[0].createdAt // empty' 2>/dev/null || true)
          echo "last success run: ${LAST:-<none>}"
          if [ -n "$LAST" ]; then
            LAST_EPOCH=$(date -u -d "$LAST" +%s 2>/dev/null || echo 0)
            NOW_EPOCH=$(date -u +%s)
            DIFF=$(( NOW_EPOCH - LAST_EPOCH ))
            echo "seconds since last success: $DIFF"
            if [ "$DIFF" -lt 36000 ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "10 小时内已有成功运行，跳过本次（避免重复消耗积分次数）"
              exit 0
            fi
          fi
          RUNNING=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$WF_FILE" \
                    --status in_progress --limit 5 --json databaseId --jq 'length' 2>/dev/null || true)
          echo "in_progress runs (incl. self): ${RUNNING:-0}"
          if [ "${RUNNING:-0}" -ge 2 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "已有另一个运行在执行中，跳过本次"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Run daily check-in & mini-games
        if: steps.guard.outputs.skip != 'true'
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          SESSION_B64: ${{ secrets.SESSION_B64 }}
          SESSION_PASS: ${{ secrets.SESSION_PASS }}
          # 结果推送目标：你的 Telegram 数字 ID（如 6357312260）；留空则发到 Saved Messages
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          # 设置 BOT_TOKEN 后，签到结果由 bot 主动推送给你（推荐）
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python games.py
