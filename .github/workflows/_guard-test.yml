name: Guard Dry Run

on:
  workflow_dispatch:

permissions:
  actions: read

jobs:
  dryrun:
    runs-on: ubuntu-latest
    steps:
      - name: Guard dry run (read-only, no side effects)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "GITHUB_WORKFLOW_REF=$GITHUB_WORKFLOW_REF"
          W="${GITHUB_WORKFLOW_REF%%@*}"
          W="${W##*/}"
          echo "parsed workflow file from env: $W"
          WF_FILE="checkin.yml"
          echo "checking runs of: $WF_FILE"
          LAST=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$WF_FILE" \
                 --status success --limit 1 --json createdAt --jq '.[0].createdAt // empty' 2>/dev/null || true)
          echo "last success run: ${LAST:-<none>}"
          if [ -n "$LAST" ]; then
            LAST_EPOCH=$(date -u -d "$LAST" +%s 2>/dev/null || echo 0)
            NOW_EPOCH=$(date -u +%s)
            DIFF=$(( NOW_EPOCH - LAST_EPOCH ))
            echo "seconds since last success: $DIFF"
            if [ "$DIFF" -lt 36000 ]; then
              echo "RESULT=SKIP (guard would skip the check-in)"
              exit 0
            fi
          fi
          RUNNING=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$WF_FILE" \
                    --status in_progress --limit 5 --json databaseId --jq 'length' 2>/dev/null || true)
          echo "in_progress count: ${RUNNING:-0}"
          echo "RESULT=RUN (guard would execute the check-in)"
